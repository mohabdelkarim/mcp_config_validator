<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Config Validator | Cursor mcp.json checker</title>
  <meta name="description" content="Free Cursor MCP config validator. Catch broken mcpServers JSON: bad args, shell-string commands, empty command, env types, before you restart the IDE.">
  <meta name="keywords" content="Cursor, MCP, mcp.json, mcpServers, Model Context Protocol, validator, JSON">
  <meta property="og:title" content="MCP Config Validator">
  <meta property="og:description" content="Catch broken Cursor mcp.json configs before you restart the IDE.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mohabdelkarim.github.io/mcp_config_validator/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MCP Config Validator">
  <meta name="twitter:description" content="Free Cursor MCP mcp.json validator for mcpServers mistakes.">
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #00f5ff;
      --error: #ff6b6b;
      --warn: #ffd166;
      --ok: #7dffa3;
      --border: #2a3a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a40 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 28px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 260px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.9rem;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin: 14px 0 20px;
      flex-wrap: wrap;
    }
    button {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 4px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      color: var(--muted);
      border-color: var(--border);
    }
    button:hover { filter: brightness(1.1); }
    #report {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.88rem;
      white-space: pre-wrap;
      min-height: 88px;
    }
    .line-ERROR { color: var(--error); }
    .line-WARN { color: var(--warn); }
    .line-OK, .line-FAIL { color: var(--ok); }
    .line-FAIL { color: var(--error); }
    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>MCP Config Validator</h1>
    <p class="sub">Catch broken Cursor MCP configs before you restart the IDE.</p>

    <label for="config">Paste your mcp.json</label>
    <textarea id="config" spellcheck="false">{
  "mcpServers": {
    "browser": {
      "command": "npx",
      "args": "-y some-package"
    }
  }
}</textarea>

    <div class="actions">
      <button type="button" id="validateBtn">Validate</button>
      <button type="button" class="secondary" id="sampleBtn">Load sample</button>
    </div>

    <div id="report" aria-live="polite">Click Validate to check your config.</div>

    <footer>
      From the creator of
      <a href="https://mohaabdelkarim.gumroad.com/" target="_blank" rel="noopener">AI Tool Drop</a>
      ·
      <a href="https://www.mohabdelkarim.com/" target="_blank" rel="noopener">mohabdelkarim.com</a>
      ·
      <a href="https://github.com/mohabdelkarim/mcp_config_validator" target="_blank" rel="noopener">GitHub</a>
      ·
      CLI: <code>pip install git+https://github.com/mohabdelkarim/mcp_config_validator.git</code>
    </footer>
  </main>

  <script>
    /*
      Rule ids (keep in sync with src/mcp_config_validator/validate.py):
      invalid_json, root_type, missing_mcp_servers, mcp_servers_type,
      server_name, server_type, missing_transport, empty_command, command_type,
      command_shell_string, args_type, args_item_type, env_type, env_value_type,
      url_type, url_http
    */
    const SAMPLE = `{
  "mcpServers": {
    "filesystem": {
      "command": "npx -y @modelcontextprotocol/server-filesystem /tmp"
    },
    "browser": {
      "command": "npx",
      "args": "-y some-package"
    },
    "docs": {
      "url": "http://example.com/mcp"
    }
  }
}`;

    function finding(severity, code, message) {
      return { severity, code, message };
    }

    function validate(config) {
      const findings = [];
      if (config === null || typeof config !== "object" || Array.isArray(config)) {
        findings.push(finding("ERROR", "root_type", "root value must be a JSON object"));
        return findings;
      }
      if (!Object.prototype.hasOwnProperty.call(config, "mcpServers")) {
        findings.push(finding("ERROR", "missing_mcp_servers", 'missing required key "mcpServers"'));
        return findings;
      }
      const servers = config.mcpServers;
      if (servers === null || typeof servers !== "object" || Array.isArray(servers)) {
        findings.push(finding("ERROR", "mcp_servers_type", '"mcpServers" must be an object of named servers'));
        return findings;
      }
      for (const [name, server] of Object.entries(servers)) {
        findings.push(...validateServer(name, server));
      }
      return findings;
    }

    function validateServer(name, server) {
      const findings = [];
      const label = `server "${name}"`;
      if (!String(name).trim()) {
        findings.push(finding("ERROR", "server_name", `${label}: server name must be non-empty (not whitespace only)`));
      }
      if (server === null || typeof server !== "object" || Array.isArray(server)) {
        findings.push(finding("ERROR", "server_type", `${label}: value must be an object`));
        return findings;
      }
      const hasCommand = Object.prototype.hasOwnProperty.call(server, "command");
      const hasUrl = Object.prototype.hasOwnProperty.call(server, "url");
      if (!hasCommand && !hasUrl) {
        findings.push(finding("ERROR", "missing_transport", `${label}: must set "command" or "url"`));
      }
      if (hasCommand) {
        const command = server.command;
        if (typeof command !== "string") {
          findings.push(finding("ERROR", "command_type", `${label}: "command" must be a string (got ${typeName(command)})`));
        } else if (!command.trim()) {
          findings.push(finding("ERROR", "empty_command", `${label}: "command" must be a non-empty string`));
        } else if (command.trim().includes(" ") && !Object.prototype.hasOwnProperty.call(server, "args")) {
          findings.push(finding("ERROR", "command_shell_string", `${label}: "command" looks like a full shell string; split into command + args (example: command "npx", args ["-y", "package"])`));
        }
        if (Object.prototype.hasOwnProperty.call(server, "args")) {
          const args = server.args;
          if (!Array.isArray(args)) {
            findings.push(finding("ERROR", "args_type", `${label}: "args" must be a list of strings (got ${typeName(args)})`));
          } else {
            args.forEach((item, idx) => {
              if (typeof item !== "string") {
                findings.push(finding("ERROR", "args_item_type", `${label}: "args[${idx}]" must be a string (got ${typeName(item)})`));
              }
            });
          }
        }
      }
      if (hasUrl) {
        const url = server.url;
        if (typeof url !== "string") {
          findings.push(finding("ERROR", "url_type", `${label}: "url" must be a string (got ${typeName(url)})`));
        } else if (url.startsWith("http://")) {
          findings.push(finding("WARN", "url_http", `${label}: "url" uses http; prefer https`));
        } else if (!url.startsWith("https://")) {
          findings.push(finding("ERROR", "url_type", `${label}: "url" must start with https:// (or http://)`));
        }
      }
      if (Object.prototype.hasOwnProperty.call(server, "env")) {
        const env = server.env;
        if (env === null || typeof env !== "object" || Array.isArray(env)) {
          findings.push(finding("ERROR", "env_type", `${label}: "env" must be an object (got ${typeName(env)})`));
        } else {
          for (const [key, value] of Object.entries(env)) {
            if (typeof value !== "string") {
              findings.push(finding("ERROR", "env_value_type", `${label}: "env.${key}" must be a string (got ${typeName(value)})`));
            }
          }
        }
      }
      return findings;
    }

    function typeName(value) {
      if (value === null) return "null";
      if (Array.isArray(value)) return "list";
      return typeof value;
    }

    function formatReport(findings, serverCount) {
      const lines = findings.map((f) => `${f.severity.padEnd(5)} ${f.message}`);
      const errors = findings.filter((f) => f.severity === "ERROR").length;
      const warnings = findings.filter((f) => f.severity === "WARN").length;
      const status = errors === 0 ? "OK" : "FAIL";
      lines.push(`${status.padEnd(5)} ${serverCount} server(s) checked, ${errors} error(s), ${warnings} warning(s)`);
      return lines;
    }

    function runValidate() {
      const raw = document.getElementById("config").value;
      const reportEl = document.getElementById("report");
      let findings;
      let serverCount = 0;
      try {
        const data = JSON.parse(raw);
        findings = validate(data);
        if (data && typeof data === "object" && data.mcpServers && typeof data.mcpServers === "object" && !Array.isArray(data.mcpServers)) {
          serverCount = Object.keys(data.mcpServers).length;
        }
      } catch (err) {
        findings = [finding("ERROR", "invalid_json", `invalid JSON: ${err.message}`)];
      }
      const lines = formatReport(findings, serverCount);
      reportEl.innerHTML = lines.map((line) => {
        const kind = line.startsWith("ERROR") ? "ERROR"
          : line.startsWith("WARN") ? "WARN"
          : line.startsWith("OK") ? "OK"
          : line.startsWith("FAIL") ? "FAIL"
          : "";
        const cls = kind ? `line-${kind}` : "";
        return `<div class="${cls}">${escapeHtml(line)}</div>`;
      }).join("");
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    document.getElementById("validateBtn").addEventListener("click", runValidate);
    document.getElementById("sampleBtn").addEventListener("click", () => {
      document.getElementById("config").value = SAMPLE;
      runValidate();
    });
  </script>
</body>
</html>
